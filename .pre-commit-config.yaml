repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: local
    hooks:
      # Mutating: reformats in place so CI can auto-commit the result.
      - id: go-fmt
        name: go format
        entry: mise run fmt
        language: system
        pass_filenames: false
        types: [go]

      - id: go-vet
        name: go vet
        entry: mise run vet
        language: system
        pass_filenames: false
        types: [go]

      - id: golangci-lint
        name: golangci-lint
        entry: mise run lint
        language: system
        pass_filenames: false
        types: [go]

      - id: frontend-lint
        name: frontend lint
        entry: mise run web:lint
        language: system
        pass_filenames: false
        files: ^web/
