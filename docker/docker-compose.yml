# Local stack: Postgres + simplecas with a local-fs storage backend.
# `docker compose up --build` then open http://localhost:9000/ui/
name: simplecas
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: simplecas
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published port: simplecas reaches it as postgres:5432 on the compose
    # network, and the well-known postgres/postgres login stays off the host's
    # interfaces. `docker compose exec postgres psql -U postgres simplecas` for
    # a shell.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  simplecas:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SIMPLECAS__DATABASE__URL: postgres://postgres:postgres@postgres:5432/simplecas
      SIMPLECAS__STORAGE__BACKEND: fs
      SIMPLECAS__STORAGE__ROOT: /data
      # OIDC is off here, so /api has no sign-in, and inside the container the
      # server has to bind every interface to be reachable at all. The server
      # refuses that combination unless told otherwise; the port below is
      # published on the host's loopback only, which is what makes it safe.
      SIMPLECAS__SERVER__INSECURE_OPEN_API: "true"
    volumes:
      - blobdata:/data
    ports:
      - "127.0.0.1:9000:9000"

volumes:
  pgdata:
  blobdata:
