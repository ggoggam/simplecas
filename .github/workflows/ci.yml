name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived token from the GitHub App (vars.APP_ID +
      # secrets.PRIVATE_KEY), scoped to contents:write, so the auto-format
      # commit below can be pushed back to the branch. The App installation
      # must grant Repository contents: Read and write.
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write

      # Check out with the App token (persisted in git config) and, on PRs, the
      # head branch — so git-auto-commit-action can push the reformatting back.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}

      # Installs the toolchain declared in mise.toml (go, golangci-lint, bun, prek).
      - uses: jdx/mise-action@v3

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-

      # Mutating hooks (go fmt, whitespace/EOF fixers) rewrite files in place
      # and exit non-zero when they change anything — that's the reformat signal.
      - name: Pre-commit
        run: mise run pre-commit

      # If the hooks reformatted anything, commit it back to the branch. Runs
      # even when the step above "failed" (files were reformatted), but not when
      # the job was cancelled. No-op on a clean tree. Skipped in the merge queue,
      # whose readonly ref can't be pushed to.
      - name: Auto-commit formatting fixes
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "style: auto-format via pre-commit hooks"

  tests:
    runs-on: ubuntu-latest

    # Every suite runs twice: with blobs on the fs backend, and with blobs on a
    # real S3 store (RustFS), which also serves as the reference the S3
    # conformance suite (e2e/conformance_test.go) is checked against.
    strategy:
      fail-fast: false
      matrix:
        blobs: [fs, s3]
    name: test (${{ matrix.blobs }} blobs)

    # The db/cas integration tests need a real Postgres; unit tests skip it.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: simplecas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - uses: jdx/mise-action@v3

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-test-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-test-${{ runner.os }}-

      # Started by hand rather than as a service: a service container cannot
      # be given the command RustFS needs (its data directory).
      - name: Start RustFS
        if: matrix.blobs == 's3'
        run: |
          docker run -d --name rustfs -p 9000:9000 \
            -e RUSTFS_ACCESS_KEY=rustfsadmin -e RUSTFS_SECRET_KEY=rustfsadmin \
            rustfs/rustfs:1.0.1 /data
          for _ in $(seq 1 30); do
            curl -sf http://localhost:9000/health >/dev/null && exit 0
            sleep 1
          done
          docker logs rustfs
          exit 1

      - name: Test
        run: go test -race -count=1 ./...
        env:
          SIMPLECAS_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/simplecas
          # Empty on the fs leg, which leaves the tests on the fs backend.
          SIMPLECAS_TEST_S3_URL: ${{ matrix.blobs == 's3' && 'http://rustfsadmin:rustfsadmin@localhost:9000/simplecas-test' || '' }}

  # The main ruleset requires a check named "test"; this reports the matrix
  # above as that one check.
  test:
    if: ${{ !cancelled() }}
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.tests.result }}" = success
