# simplecas configuration. Every field can be overridden with env vars, e.g.
#   SIMPLECAS__DATABASE__URL=postgres://…
#   SIMPLECAS__STORAGE__BACKEND=s3
[server]
bind = "0.0.0.0:9000"
region = "us-east-1"
# With OIDC off nothing authenticates /api, so the server refuses to start on a
# non-loopback bind like the one above. Either enable [oidc], bind 127.0.0.1,
# or, when ingress in front already decides who reaches the port, accept the
# open admin plane explicitly:
# insecure_open_api = true

[database]
url = "postgres://postgres:postgres@localhost:55432/simplecas"
max_connections = 16

# Storage backend. Swap `backend` to s3 / gcs / azblob and fill the matching
# fields; the logical blob layout is identical across all of them.
[storage]
backend = "fs"
root = "./data"

# [storage]
# backend = "s3"
# bucket = "my-cas-bucket"
# region = "us-east-1"
# endpoint = "https://s3.amazonaws.com"   # or a MinIO/R2 endpoint
# access_key_id = "…"
# secret_access_key = "…"

# S3 gateway auth. Disabled = anonymous access (fine behind private ingress or
# for the bundled PWA). Enable to require SigV4-signed requests.
[auth]
enabled = false
access_key_id = "simplecas"
secret_access_key = "simplecas-secret"
# Seals the per-team S3 secrets in the database; required with [oidc] on. Each
# entry is "id:<32 random bytes, base64>" (openssl rand -base64 32). The first
# seals; the rest only open, which is how a key is rotated (see the README).
# credential_keys = ["k1:…"]

# OIDC single sign-on for the human surface (the /ui PWA and /api admin API).
# Disabled by default; the S3 gateway at / keeps its own SigV4 auth regardless.
# Sessions are rows in Postgres referred to by a signed cookie, so they can be
# listed and revoked; every instance behind the load balancer needs the same
# session_secret. Uncomment and fill in to require sign-in:
#
# [oidc]
# enabled = true
# public_url = "https://cas.example.com"      # used to derive redirect URIs
# session_secret = "change-me-to-32+-random-bytes"
# session_ttl_secs = 86400
# # Optional allowlist. Empty = admit anyone who authenticates. When set, the
# # (verified) email must match a domain or address here.
# allowed_domains = ["example.com"]
# allowed_emails = []
#
# [[oidc.providers]]
# id = "google"                                # slug used in the redirect URI
# name = "Google"                              # label on the login button
# issuer = "https://accounts.google.com"
# client_id = "…"
# client_secret = "…"                          # omit for public (PKCE) clients
# scopes = ["openid", "email", "profile"]
#
# Redirect URI to register with the provider:
#   <public_url>/auth/oidc/<id>/callback   e.g. https://cas.example.com/auth/oidc/google/callback

[gc]
interval_secs = 60
grace_secs = 300
# How long a multipart upload may sit inactive (no initiation or new part)
# before it's abandoned and its staged parts reclaimed. Default: 86400 (24h).
multipart_expiry_secs = 86400
# How often to list every stored blob and reclaim bytes no blob row accounts
# for (left by an upload that failed to commit). The listing touches every
# blob, so keep it infrequent. Default: 86400 (24h).
orphan_interval_secs = 86400

# Request and storage limits. Over-limit uploads get 400 EntityTooLarge, and
# writes past a team's quota get 403 QuotaExceeded.
[limits]
# A single PUT, or the assembled size of a multipart upload. Default: 5 TiB.
max_object_bytes = 5497558138880
# One multipart part. Default: 5 GiB. Keep it at 8 MiB or more: the PWA uploads
# in 8 MiB parts.
max_part_bytes = 5368709120
# Logical bytes each team may store: its objects plus the parts of unfinished
# multipart uploads, with content shared with other teams counted in full.
# 0 = no quota. Namespaces without a team are never charged.
tenant_quota_bytes = 0
# Drop a connection whose upload or download body moves no bytes for this long.
# There is no cap on the total time a transfer takes.
stall_timeout_secs = 60
